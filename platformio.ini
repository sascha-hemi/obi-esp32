; PlatformIO Project Configuration for OBI ESP32
;
; Open Battery Information - Seeed XIAO ESP32-S3 version
; Communicates with Makita LXT batteries via modified OneWire protocol
;
; Hardware:
;   - OneWire Data: GPIO3 (D2 on XIAO header)
;   - Enable Pin: GPIO4 (D3 on XIAO header)
;   - Pull-up resistors: 4.7kΩ to 3.3V on both data lines
;
; Note: On the XIAO ESP32-S3 Sense variant GPIO1-GPIO3 may be
;       occupied by the PSRAM. Use GPIO5+ on that variant.

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; MCU settings
board_build.mcu = esp32s3
board_build.f_cpu = 160000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; Build flags - USB CDC and pin definitions
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DONEWIRE_PIN=3
    -DENABLE_PIN=4

; Monitor settings (port auto-detected; on macOS: /dev/cu.usbmodem*)
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder

; Upload settings (port auto-detected)
upload_speed = 921600

; Library dependencies
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0